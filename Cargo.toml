[package]
name = "morstilia"
version = "7.0.0"
edition = "2024"
description = "A strong classical UCI chess engine built on shakmaty"
license = "MIT"
build = "build.rs"

[dependencies]
shakmaty = "0.30.1"
shakmaty-syzygy = "0.28.1"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rayon = "1"

[[bin]]
name = "selfplay"
path = "src/bin/selfplay.rs"

[[bin]]
name = "morstilia-selfplay"
path = "src/bin/morstilia-selfplay.rs"

[dev-dependencies]
criterion = "0.5"
serde_json = "1"

[[bench]]
name = "perft"
harness = false

[[bench]]
name = "nps"
harness = false

[[bench]]
name = "eval"
harness = false

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"

[profile.bench]
lto = true
opt-level = 3
codegen-units = 1